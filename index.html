<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock - Tracey Marie</title>
</head>

<body>
    <div class="container">
        <h1>World Clock BST</h1>
        <select name="city" id="">
            <option value="">Select a city..</option>
            <option value="LocalTime">Local Time📍</option>
            <option value="Bahamas">Bahamas</option>
            <option value="">Tokyo</option>
            <option value="">California</option>
            <option value="">London</option>
            <option value="">Morocco</option>
            <option value="">Abidjan</option>
            <option value="">Switzerland</option>

        </select>
        <div class="city" id="bahamas">
            <div>
                <h2>Bahamas</h2>
                <div class="hours">
                    +9hrs
                </div>
            </div>
            <div class="time">
                19:50 <span class="timing">PM</span>
            </div>
        </div>
        <div class="city" id="tokyo">
            <div>
                <h2>Tokyo</h2>
                <div class="hours">
                    +9hrs
                </div>
            </div>
            <div class="time">
                19:50 <span class="timing">PM</span>
            </div>
        </div>


    </div>
    <footer> This is rendered by <a href="https://www.linkedin.com/in/traceymarie88/"><em>Tracey-Marie💗</em></a>,
        live
        on <a href="https://myworldclock-tracey.netlify.app/">Netlify</a>. Open-sourced on <a
            href="github.com/TIAMUSE88">Github.</a></footer>
    <script src="javascript/index.js"></script>
</body>

</html>
